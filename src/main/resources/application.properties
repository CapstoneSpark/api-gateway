server.port=9090
spring.application.name=api-gateway

logging.level.root=INFO
logging.level.com.ecommerce.gateway=DEBUG

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ----------------------------
# API Gateway Routes
# ----------------------------

# User Service
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/users/**, /auth/**, /api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

# Product Service
spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/products/**, /api/v1/categories/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0


# Product-Category Mapping Service
spring.cloud.gateway.routes[6].id=product-category-service
spring.cloud.gateway.routes[6].uri=http://localhost:8082
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/product-categories/**
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=0

# Cart Service
spring.cloud.gateway.routes[2].id=cart-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/cart/**, /api/v1/cart/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=0



# Order Service
spring.cloud.gateway.routes[3].id=order-service
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/orders/**, /api/v1/orders
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=0

# Payment Service
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=http://localhost:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/payments/**, /api/v1/payments
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=0

# Notification Service
spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=http://localhost:8086
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/notifications/**, /api/v1/notifications
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=0

# Wishlist & Recently Viewed Service
spring.cloud.gateway.routes[7].id=wishlist-service
spring.cloud.gateway.routes[7].uri=http://localhost:8087
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/wishlist/**, /api/v1/recently-viewed/**
spring.cloud.gateway.routes[7].filters[0]=StripPrefix=0


# ----------------------------------
# Chatbot Service (PORT 8088)
# ----------------------------------
spring.cloud.gateway.routes[8].id=chatbot-service
spring.cloud.gateway.routes[8].uri=http://localhost:8088
spring.cloud.gateway.routes[8].predicates[0]=Path=/chatbot/** 
spring.cloud.gateway.routes[8].filters[0]=StripPrefix=0